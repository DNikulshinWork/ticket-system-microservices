name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. СНАЧАЛА устанавливаем pnpm (версия автоматически берется из package.json)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # 2. ЗАТЕМ настраиваем Node.js и кэш pnpm (теперь pnpm уже есть в PATH)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps and packages
        run: pnpm run build

      - name: Run Smoke Test (requires Docker)
        run: |
          pnpm docker:up -d
          sleep 15 # Даем PostgreSQL и Redpanda время на инициализацию
          pnpm run smoke-test