name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint || true # Игнорируем ошибки линтера пока, если их нет

      - name: Build all apps and packages
        run: pnpm run build

      - name: Run Smoke Test (requires Docker)
        run: |
          pnpm docker:up -d
          sleep 15 # Даем базам данных время на запуск
          pnpm run smoke-test