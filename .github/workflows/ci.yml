name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Актуальный LTS, избегаем предупреждений о Node 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Мы убрали 'version: 9'. Теперь action сам прочитает "pnpm@9.12.0" из package.json!

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps and packages
        run: pnpm run build

      - name: Run Smoke Test (requires Docker)
        run: |
          pnpm docker:up -d
          sleep 15 # Даем PostgreSQL и Redpanda время на инициализацию
          pnpm run smoke-test