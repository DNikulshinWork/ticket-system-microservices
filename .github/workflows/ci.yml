name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Добавляем переменные окружения для всего джоба
    env:
      # Фиктивный URL нужен только для prisma generate на этапе сборки
      DATABASE_URL: "postgresql://user:password@localhost:5432/ticket_db?schema=public"
      KAFKA_BROKER: "localhost:9092"
      PORT: "3000"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps and packages
        run: pnpm run build

      - name: Run Smoke Test (requires Docker)
        run: |
          pnpm docker:up -d
          sleep 15
          pnpm run smoke-test